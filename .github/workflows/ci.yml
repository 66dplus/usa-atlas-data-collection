name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PostgreSQL binaries on PATH
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Python database test dependency
        run: python3 -m pip install -r database/requirements-ci.txt
      - name: Collector checks
        working-directory: full
        run: |
          python3 collect.py validate
          python3 -m unittest test_collect.py test_server_runner.py
      - name: Reader contract checks
        run: |
          python3 database/reader/export_reader.py --check
          USA_ATLAS_REQUIRE_READER_POSTGRES=1 python3 -m unittest database.tests.test_reader_contract
      - name: Reader v2 and source identity checks
        run: |
          python3 -m unittest discover -s database/reader/v2/tests -p 'test_*.py'
          python3 -m unittest discover -s full/politics_20261026/tests -p 'test_*.py'
          python3 -m unittest database.reader.v2.tests.test_ci_postgres
      - name: Data refresh worker checks
        run: |
          test -f full/data_refresh_20261026/tests/test_refresh.py
          PYTHONPATH=full python3 -m unittest data_refresh_20261026.tests.test_refresh
      - name: Housing stock checks
        working-directory: full
        run: python3 -m unittest test_housing_stock_2021.py
      - name: Pilot checks
        working-directory: pilot
        run: python3 -m unittest test_run_pilot.py
      - name: Database integration checks
        working-directory: database
        run: python3 -W error::ResourceWarning -m unittest test_database.py
